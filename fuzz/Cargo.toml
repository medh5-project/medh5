# The fuzz targets of the engine's readers (`cargo fuzz`, on a nightly Rust;
# .github/workflows/fuzz.yml runs them).  A workspace of its own, so the root
# workspace --- its lock, THIRD_PARTY_NOTICES and `cargo package` --- never
# sees it.  A crash a run finds becomes a minimised regression test in the
# crate it hit, never a committed input.
[package]
name = "medh5-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.5.0", features = ["derive"] }
# HDF5 through `medh5::hdf5`, the one the engine links.
medh5 = { path = "../crates/medh5" }
medh5-sys = { path = "../crates/medh5-sys" }
# gzip for the NIfTI target's compressed files, as the engine inflates them.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# HDF5 with the workspace's patches (vendor/hdf5-metno-src/PATCHES.md): the
# library the wheels and binaries link, not the one crates.io publishes.
[patch.crates-io]
hdf5-metno-src = { path = "../vendor/hdf5-metno-src" }

[profile.release]
debug = 1

# The corpus seeds: the conformance corpus's small files, and ITK transform
# files the engine writes.
[[bin]]
name = "seed"
path = "src/bin/seed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_validate"
path = "fuzz_targets/open_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clinical_columns"
path = "fuzz_targets/clinical_columns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zstd_filter"
path = "fuzz_targets/zstd_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blosc2_filter"
path = "fuzz_targets/blosc2_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nifti_header"
path = "fuzz_targets/nifti_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "itk_transform"
path = "fuzz_targets/itk_transform.rs"
test = false
doc = false
bench = false
