[build-system]
# The package is the Rust engine (crates/medh5) compiled as `medh5._core`, plus
# the Python sources under medh5/.  maturin builds both into one wheel.
# 1.9.3 is the first maturin that writes PEP 639's `License-Expression` for
# an SPDX `license` (1.9.0 still wrote the legacy `License` field, and 1.8
# cannot read `license-files` as a list): the floor is the version CI's
# `sdist` job builds with.
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "medh5"
# The one source of the version is the Cargo workspace (`Cargo.toml`): maturin
# stamps it on the wheel, the engine stamps it into every file's `generator`,
# and `medh5.__version__` reads it back from the compiled module.
dynamic = ["version"]
description = "Self-describing HDF5 container for one medical imaging sample and all of its ground truth: multi-timepoint, multi-modal images with segmentation, detection, classification and registration annotations, provenance and integrity."
readme = "README.md"
requires-python = ">=3.10"
# The package is MIT.  Its wheels also compile in HDF5, C-Blosc2, Zstandard
# and `subtle` (BSD-3-Clause), LZ4 and rust-numpy (BSD-2-Clause), zlib and
# `foldhash` (Zlib), `unicode-general-category` (Apache-2.0) and
# `borrow-or-share` (MIT-0).  THIRD_PARTY_NOTICES reproduces the licence of
# everything they compile in, generated from Cargo.lock by
# .github/scripts/third_party_notices.py; the Homebrew formula states the same
# expression.
license = "MIT AND BSD-3-Clause AND BSD-2-Clause AND Zlib AND Apache-2.0 AND MIT-0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [
  { name = "Puyang Wang", email = "pauliwang411@gmail.com" },
]
keywords = [
  "medical imaging",
  "hdf5",
  "blosc2",
  "machine learning",
  "segmentation",
  "detection",
  "registration",
  "longitudinal",
  "nifti",
  "dicom",
  "rtstruct",
  "nnunet",
  "pytorch",
  "monai",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  # HDF5, Blosc2 and the JSON Schema validator are compiled into the engine;
  # NumPy is the one runtime dependency, because arrays are the API.
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  # Pinned, not floated: CI ran `pip install ruff` unpinned and broke when 0.16
  # started formatting Markdown. A lint gate that changes under you is not a gate.
  "ruff==0.16.3",
  "mypy==1.18.2",
  "maturin>=1.9.3,<2",
  "twine>=5.0",
  # The release notes are the changelog, parsed to rejoin its wrapped lines
  # (.github/scripts/release_notes.py); its tests render them.
  "markdown-it-py>=2.2",
  "hypothesis>=6.100",
  # The tests open files with h5py to plant the defects the validator must
  # find; the package itself never imports it.
  "h5py>=3.13",
  "hdf5plugin>=4.1",
  # The tests write NIfTI inputs with nibabel, the reader the engine's
  # converter is checked against; the package itself never imports it.
  "nibabel>=5",
]
# Reading and writing medh5 files with h5py directly, as any HDF5 tool can:
# hdf5plugin carries the Blosc2 filter the default profiles use.
h5py = [
  "h5py>=3.13",
  "hdf5plugin>=4.1",
]
torch = [
  "torch>=2.0",
]
monai = [
  # Only needed for `medh5.monai`; the affine and metadata it builds are
  # computed without it, so the geometry is testable in a bare environment.
  "monai>=1.3",
  "torch>=2.0",
]
# Empty since 2.2.0, which reads and writes NIfTI in the engine; kept so that
# `medh5[nifti]` still installs.
nifti = []
dicom = [
  # 3.0: writing an RTSTRUCT asks `save_as` to enforce the DICOM file format;
  # 3.0.1, because highdicom requires it and the floor is installed together.
  "pydicom>=3.0.1",
]
# Reading MEDS datasets (`medh5.io.meds`, `clinical augment --from-meds`): its
# Parquet shards.  14 reads MEDS 0.3's large_string text_value.
meds = [
  "pyarrow>=14",
]
dicomseg = [
  # Reading DICOM SEG and RTSTRUCT needs only pydicom; *writing* a SEG needs
  # highdicom, the reference implementation of the Segmentation IOD.  Building
  # the per-frame functional groups by hand is how invalid SEGs get published.
  # 0.23 is the first highdicom for pydicom 3, and it requires pydicom 3.0.1.
  "highdicom>=0.23",
  "pydicom>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/medh5-project/medh5"
Repository = "https://github.com/medh5-project/medh5"
Issues = "https://github.com/medh5-project/medh5/issues"
Changelog = "https://github.com/medh5-project/medh5/blob/main/CHANGELOG.md"
Documentation = "https://medh5.readthedocs.io/"
# The released documentation's, not main's: PyPI keeps these with the release.
"Specification 1.0" = "https://medh5.readthedocs.io/en/stable/spec/medh5-1.0/"
"Specification 1.1" = "https://medh5.readthedocs.io/en/stable/spec/medh5-1.1/"

[project.scripts]
medh5 = "medh5.cli:main"

[tool.maturin]
# The extension module is `medh5._core`; the Python half of the package is the
# `medh5/` directory next to this file.
manifest-path = "crates/medh5-python/Cargo.toml"
module-name = "medh5._core"
python-source = "."
python-packages = ["medh5"]
features = ["extension-module"]
# The sdist carries what makes the package auditable --- the normative
# specification, the documentation and the test suite --- as well as the
# engine's sources, which hold the JSON Schema and the code table: a format
# release whose source distribution omits the format is not one.
include = [
  # NDEBUG for HDF5 on MSVC targets: see the file.
  { path = ".cargo/config.toml", format = "sdist" },
  { path = "LICENSE", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "changes/*.md", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  # The native inventory, the advisories against it and their VEX statements.
  { path = "SECURITY.md", format = "sdist" },
  { path = "vex/*.json", format = "sdist" },
  { path = "docs/**/*.md", format = "sdist" },
  { path = "docs/**/*.py", format = "sdist" },
  { path = "tests/**/*.py", format = "sdist" },
  { path = "tests/**/*.txt", format = "sdist" },
  # The tests' data: the ITK golden files, and the NIfTI parity corpus ---
  # what 2.1.0's converter did, which the engine's converter is held to.
  { path = "tests/data/**/*.json", format = "sdist" },
  { path = "tests/data/**/*.md", format = "sdist" },
  { path = "tests/data/**/*.nii", format = "sdist" },
  { path = "tests/data/**/*.gz", format = "sdist" },
  { path = "tests/data/**/*.hdr", format = "sdist" },
  { path = "tests/data/**/*.img", format = "sdist" },
  { path = "tests/data/**/*.bval", format = "sdist" },
  { path = "tests/data/**/*.mgh", format = "sdist" },
  { path = "tests/data/**/*.medh5", format = "sdist" },
  { path = "tests/data/**/*.tfm", format = "sdist" },
  { path = "tests/data/**/*.mat", format = "sdist" },
  # What the shipped tests read about the project itself --- the workflows and
  # release scripts `tests/project` checks --- and what the documentation is
  # built with, so `pytest tests/project` and `mkdocs build` run from the
  # unpacked sdist as they do from a checkout.
  { path = ".github/dependabot.yml", format = "sdist" },
  { path = ".pre-commit-config.yaml", format = "sdist" },
  { path = "deny.toml", format = "sdist" },
  { path = ".github/scripts/*.py", format = "sdist" },
  { path = ".github/scripts/*.sh", format = "sdist" },
  { path = ".github/workflows/*.yml", format = "sdist" },
  { path = "mkdocs.yml", format = "sdist" },
  { path = "hooks/*.py", format = "sdist" },
  { path = "docs/requirements.txt", format = "sdist" },
]

[tool.pytest.ini_options]
addopts = "--cov=medh5 --cov-report=term-missing"
# A deprecation warning is an error unless a test expects it with
# `pytest.warns(..., match="^medh5 3.0 ")`: medh5 never uses what it deprecates.
filterwarnings = ["error:medh5 3\\.0 "]

[tool.ruff]
target-version = "py310"
# Reference/benchmark scripts published alongside the 1.0 spec. They are documentation
# artifacts meant to be read next to the prose -- deliberately compact, not library code.
#
# `site` is the `mkdocs build` output. MkDocs copies those same benchmark scripts into
# it, so without this a local docs build makes `ruff check .` fail on copies of files
# the line above already excludes.
extend-exclude = ["docs/examples", "site"]

# ruff >= 0.16 formats Python inside Markdown code blocks. Not here: the snippets
# in docs/ and README.md are prose examples, sized to be read on the page and
# verified by being executed, and one-argument-per-line turns a four-line call
# into eight without making it more correct. Source is formatted; documentation
# about source is written.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
# RUF100 fails on a `noqa` for a rule that is not selected. Fifty of them
# accumulated for a rule family nobody had turned on; a suppression that
# suppresses nothing is a comment that lies.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "nibabel",
  "nibabel.*",
  "pydicom",
  "pydicom.*",
  "monai",
  "monai.*",
  "highdicom",
  "highdicom.*",
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true
follow_imports = "skip"
