      - Segmentation: guides/segmentation.md
      - Detection and boxes: guides/detection.md
      - Partial labels and coverage: guides/partial-labels.md
      - Longitudinal studies: guides/longitudinal.md
      - Registration between visits: guides/registration.md
      - Resample onto another grid: guides/resample.md
      - Clinical history beside the images: guides/clinical.md
      - Train on clinical tasks: guides/clinical-training.md
      - Import from MEDS or FHIR: guides/clinical-import.md
      - Classification and change labels: guides/classification.md
      - Record review, provenance and agreement: guides/review-and-provenance.md
      - Choose and map a label set: guides/label-sets.md
      - Import from DICOM: guides/import-dicom.md
      - Import from NIfTI and nnU-Net: guides/import-nifti.md
      - Import DICOM SEG and RTSTRUCT: guides/import-seg-rtstruct.md
      - Export to other formats: guides/export.md
      - Migrate from 0.x: guides/migrate-0x.md
      - Build and split a cohort: guides/cohorts.md
      - Pack small samples into collections: guides/collections.md
      - Check a file before training on it: guides/validate.md
      - Run the conformance suite: guides/conformance.md
      - De-identify and publish: guides/deidentify.md
      - Tune performance: guides/performance.md

  - Reference:
