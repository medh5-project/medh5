# CI runs these over every file (`pre-commit run --all-files`, in the `lint`
# job), so a commit made without them installed is held to them anyway.

# Vendored C stays as upstream wrote it: its local changes are the ones its
# PATCHES.md lists, and a whitespace fix would be one more.
exclude: ^(crates/medh5-sys/)?vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # A patch's context lines carry the whitespace of the file it patches.
        exclude: \.(patch|diff)$
      - id: end-of-file-fixer
      - id: check-yaml
        # `mkdocs.yml` carries a `!!python/object/apply:` tag to give MkDocs
        # GitHub's heading-slug function (see the comment there). `check-yaml`
        # parses with `yaml.safe_load`, which refuses that tag by design.
        # Excluding the one file keeps the check strict everywhere else --- the
        # alternative, `--unsafe`, would weaken it for every workflow too.
        exclude: ^mkdocs\.yml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The same ruff the `dev` extra pins and CI runs. Bump the two together:
    # a hook five minor versions behind formats differently from the gate.
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
