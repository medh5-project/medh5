[workspace]
resolver = "2"
members = [
  "crates/medh5-sys",
  "crates/medh5",
  "crates/medh5-cli",
  "crates/medh5-python",
]
default-members = [
  "crates/medh5-sys",
  "crates/medh5",
  "crates/medh5-cli",
]

[workspace.package]
# The one source of the package version for every frontend: the Rust crates,
# the CLI and the Python wheel (pyproject.toml reads it through maturin).  It is
# stamped into every file's `generator` attribute and every manifest.
version = "2.2.5"
edition = "2021"
rust-version = "1.85.1"
license = "MIT"
authors = ["Puyang Wang <pauliwang411@gmail.com>"]
repository = "https://github.com/medh5-project/medh5"
homepage = "https://medh5.readthedocs.io/"

[workspace.dependencies]
medh5-sys = { path = "crates/medh5-sys", version = "=2.2.5" }
medh5 = { path = "crates/medh5", version = "=2.2.5" }
medh5-cli = { path = "crates/medh5-cli", version = "=2.2.5" }
hdf5 = { package = "hdf5-metno", version = "0.15.0", features = ["static", "zlib", "f16"] }
ndarray = "0.17"
half = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10"
blake2 = "0.10"
digest = "0.10"
hex = "0.4"
regex = "1"
thiserror = "2"
jsonschema = { version = "0.58", default-features = false }
# gzip for NIfTI, in pure Rust (miniz_oxide): no zlib gz* symbol is linked.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
unicode-normalization = "0.1"
libc = "0.2"
# HDF5's lock is parking_lot's in a build from crates.io: a forked child takes
# the parent's threads off its queue (`medh5_sys::forget_lock_waiters`).  It is
# not in what this workspace builds (vendor/hdf5-metno-sys/PATCHES.md), nor are
# the locks a fork takes for the calls whose workers run (`medh5::parallel`):
# letting go of those in the child must not need parking_lot's table, which a
# parent's thread may hold at the fork.
parking_lot = "0.12"
parking_lot_core = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
clap = { version = "4.5", features = ["string", "wrap_help"] }
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
pyo3-build-config = "0.29.3"
numpy = { version = "0.29.0", features = ["half"] }

# HDF5 as `hdf5-metno-src` 0.10.4 packages it, and its bindings as
# `hdf5-metno-sys` 0.12.5 are, with the changes each one's PATCHES.md lists
# under vendor/.  `[patch]` reaches what this workspace builds (the wheels, the
# sdist, the standalone binaries), not a crate that depends on `medh5` from
# crates.io; SECURITY.md says which.
[patch.crates-io]
hdf5-metno-src = { path = "vendor/hdf5-metno-src" }
hdf5-metno-sys = { path = "vendor/hdf5-metno-sys" }

[profile.release]
lto = "thin"
codegen-units = 4
# The symbol table, which nothing that ships reads: 5.4 MB of the 30 MB
# extension.  Python finds the module by its dynamic symbols, which stay, and a
# panic keeps its message and location; a Rust backtrace loses frame names.
strip = "symbols"
