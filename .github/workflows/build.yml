name: Build

# One platform's wheels (abi3, and free-threaded 3.14) and native binary, built
# together from one checkout and one lock.  `ci.yml` calls this once per
# platform, as a job of its own, so each platform's tests wait for its own
# build and no other: as one matrix job, no test started before the slowest of
# the five builds ended.
on:
  workflow_call:
    inputs:
      target:
        description: The Rust target triple.
        type: string
        required: true
      runner:
        description: The runner the build runs on.
        type: string
        required: true
      container:
        description: >-
          A manylinux or musllinux image, by digest, to build in; none
          elsewhere.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Every platform the project ships: the abi3 wheel and the native binary,
    # built together from one checkout and one lock.  The release publishes
    # these artifacts as they are, so each is checked here: the binary runs the
    # conformance corpus and hands a converter to the wheel's Python, and the
    # wheel imports and runs the corpus too.
    name: build (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    # A caller cannot bound a called workflow's job; the job bounds itself.
    timeout-minutes: 60
    env:
      # The oldest macOS the wheel and the binary support; ignored elsewhere.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The free-threaded CPython the second wheel is built for; a container
      # image has its own (build-dist.sh).  The 3.12 above stays first on PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: free-threaded
        if: ${{ !inputs.container }}
        with:
          python-version: "3.14t"
          update-environment: false
      # The crates' builds, HDF5's among them, as `main`'s last run of this
      # platform left them; only `main` saves them.  Never on a tag: the
      # release publishes what its run on the tag builds, so that build starts
      # clean.  Not in the containers, whose Rust and
      # Cargo home are the container's: the Windows build, which compiles HDF5
      # each time, is the one on the pull request's longest path.
      - name: Install the pinned Rust for the cache's key
        if: ${{ !inputs.container && !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.container && !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: ${{ inputs.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build in a container
        if: inputs.container
        run: docker run --rm -v "$PWD:/io" -w /io "${{ inputs.container }}" bash .github/scripts/build-dist.sh "${{ inputs.target }}"
      - name: Build
        if: ${{ !inputs.container }}
        shell: bash
        env:
          MEDH5_FT_PYTHON: ${{ steps.free-threaded.outputs.python-path }}
        run: bash .github/scripts/build-dist.sh "${{ inputs.target }}"
      - name: The binary runs the conformance corpus
        shell: bash
        run: |
          exe="target/${{ inputs.target }}/release/medh5"
          if [[ -f "$exe.exe" ]]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" conformance build "$RUNNER_TEMP/corpus-native"
          "$exe" conformance run "$RUNNER_TEMP/corpus-native"
          # Damage is a report, never an abort: what an HDF5 built without
          # NDEBUG does on a damaged file.  The structural fixtures are the
          # shapes of 2.0.2's denial-of-service bugs, each reported within a
          # time and a memory bound.
          "$exe" conformance build --robustness "$RUNNER_TEMP/robustness"
          python .github/scripts/damaged.py "$exe" "$RUNNER_TEMP/corpus-native" --structural "$RUNNER_TEMP/robustness"
      # A musl wheel installs only where there is musl: its own test job runs
      # these two checks in the image it was built in (test-musl.sh).
      - name: The wheel installs and runs the conformance corpus
        if: ${{ !endsWith(inputs.target, '-musl') }}
        shell: bash
        run: |
          python -c "import platform; print(platform.machine())"
          pip install dist/*-abi3-*.whl
          cd "$RUNNER_TEMP"
          python -c "import medh5; print(medh5.__version__, medh5.__file__)"
          medh5 --version
          medh5 conformance build corpus
          medh5 conformance run corpus
      # The converters but NIfTI's are the Python package's: the standalone
      # binary runs them through a Python that has it (`MEDH5_PYTHON`, or
      # `python3`/`python`), and says what to install when there is none.  Out
      # of the checkout, whose `medh5/` has no compiled engine and would shadow
      # the installed one.
      - name: The binary hands the converters to the wheel's Python
        if: ${{ !endsWith(inputs.target, '-musl') }}
        shell: bash
        run: |
          exe="$PWD/target/${{ inputs.target }}/release/medh5"
          if [[ -f "$exe.exe" ]]; then exe="$exe.exe"; fi
          cd "$RUNNER_TEMP"
          # Only the Python package says this, and it needs none of the extras.
          status=0
          MEDH5_PYTHON=python "$exe" convert from-dicom . x.medh5 --report . 2> bridged.log || status=$?
          cat bridged.log
          [[ $status == 1 ]]
          grep -F "is a directory; name the file to write" bridged.log
          status=0
          MEDH5_PYTHON=/nonexistent "$exe" convert from-dicom . x.medh5 --report . 2> missing.log || status=$?
          cat missing.log
          [[ $status == 1 ]]
          grep -F "MEDH5_PYTHON" missing.log
          # NIfTI is converted by the binary itself (W22-02), with no Python.
          status=0
          MEDH5_PYTHON=/nonexistent "$exe" convert from-nifti x.medh5 --image CT 2> native.log || status=$?
          cat native.log
          [[ $status == 1 ]]
          grep -F -e "--image expects NAME=VALUE" native.log
          # Not `! grep`: `set -e` ignores a command whose status is negated.
          if grep -F "MEDH5_PYTHON" native.log; then exit 1; fi
          # The clinical importers too (W21-12): the refusal is the package's.
          status=0
          MEDH5_PYTHON=python "$exe" clinical augment x.medh5 --from-fhir b.json \
            --fhir-subject Patient/1 --kind X=other 2> imported.log || status=$?
          cat imported.log
          [[ $status == 1 ]]
          grep -F "MEDS options, which --from-fhir does not take" imported.log
      # Not `dist`: when `release.yml` calls this workflow, the release's own
      # job uploads that name in the same run, and artifact names are unique.
      # A pull request's artifacts are kept 3 days, which is all anyone reads
      # them for; a release's, 90, so re-running its failed jobs finds them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-dist-${{ inputs.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-cli-${{ inputs.target }}
          path: cli/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}
