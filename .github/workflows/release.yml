name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  ci:
    # The whole CI, on the tagged commit.  The pull request's checks ran on its
    # head, and a tag can be pushed on any commit; publishing waits on this,
    # and publishes the wheels, sdist and binaries this run built.
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  advisories:
    # No advisory against what the release compiles in or what the package
    # requires, unless SECURITY.md says why it does not apply: an advisory
    # published after the pull request merged stops the release here, before
    # anything is published.  One against what an extra installs is reported
    # in the run's summary and dispositioned in SECURITY.md, and does not.
    name: Advisories on the tagged commit
    uses: ./.github/workflows/advisories.yml
    with:
      release: true
    permissions:
      contents: read

  build:
    name: Collect and check the distributions
    needs: [ci, advisories]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.version.outputs.latest }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tooling
        # markdown-it-py parses CHANGELOG.md for the release notes.
        run: pip install --upgrade twine packaging markdown-it-py

      - name: Classify the version
        id: version
        # By PEP 440, not by pattern: `1.5.0-rc.1` is `1.5.0rc1` spelled
        # another way, and either is a pre-release.  `latest` is whether no
        # final release tagged is newer: a backport (a 2.0.x patch after
        # 2.1.0) must not become GitHub's "Latest", nor move the tap back.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          print(f"version={tag}")
          print(f"prerelease={str(Version(tag).is_prerelease).lower()}")
          PY
          python .github/scripts/release.py newest "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Verify the tag matches the version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          ref = os.environ["GITHUB_REF"]
          m = re.fullmatch(r"refs/tags/v(.+)", ref)
          if not m:
              sys.exit(f"unexpected GITHUB_REF: {ref}")
          tag_version = m.group(1)
          # The Cargo workspace is the one source of the version: every crate
          # inherits it, maturin stamps it on the wheel, and the engine writes
          # it into every file's `generator`.
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          if version != tag_version:
              sys.exit(f"tag {tag_version!r} does not match the workspace version {version!r}")
          print(f"tag and workspace version agree: {tag_version}")
          PY

      - name: Extract release notes from CHANGELOG.md
        # Here rather than in the release job: a tag whose version has no
        # CHANGELOG section --- or a CHANGELOG with entries still under
        # [Unreleased] --- fails before anything is published, not after.
        run: python .github/scripts/release_notes.py

      - name: Download what CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-dist-*
          merge-multiple: true
          path: dist/

      - name: Download the binaries CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-cli-*
          merge-multiple: true
          path: cli/

      - name: twine check
        run: twine check dist/*

      - name: Verify every platform, at this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, zipfile
          from packaging.version import Version
          # The wheels carry PEP 440's spelling of the version (2.1.0rc1), the
          # binaries Cargo's (2.1.0-rc.1, as tagged).
          raw = os.environ["VERSION"]
          version = Version(raw)
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          # Each target the project ships, with its wheels' platform tag: an
          # abi3 wheel, one for free-threaded CPython 3.14 (which cannot load
          # the abi3 one), and the binary.
          platforms = {
              "x86_64-unknown-linux-gnu": "manylinux_2_28_x86_64",
              "aarch64-unknown-linux-gnu": "manylinux_2_28_aarch64",
              "x86_64-unknown-linux-musl": "musllinux_1_2_x86_64",
              "aarch64-unknown-linux-musl": "musllinux_1_2_aarch64",
              "aarch64-apple-darwin": "macosx_11_0_arm64",
              "x86_64-pc-windows-msvc": "win_amd64",
          }
          problems = []
          for platform in platforms.values():
              for abi in ("cp310-abi3", "cp314-cp314t"):
                  found = [w for w in wheels if w.name.endswith(f"-{abi}-{platform}.whl")]
                  if len(found) != 1:
                      problems.append(f"{len(found)} {abi} wheels for {platform}")
          if len(wheels) != 2 * len(platforms):
              problems.append(f"{len(wheels)} wheels, not {2 * len(platforms)}")
          if len(sdists) != 1:
              problems.append(f"{len(sdists)} sdists")
          for dist in [*wheels, *sdists]:
              if Version(dist.name.split("-")[1].removesuffix(".tar.gz")) != version:
                  problems.append(f"{dist.name} is not version {version}")
          for wheel in wheels:
              names = zipfile.ZipFile(wheel).namelist()
              for required in ("medh5/py.typed", "medh5/_core.pyi"):
                  if required not in names:
                      problems.append(f"{wheel.name} lacks {required}")
              if not any(n.startswith("medh5/_core.") and not n.endswith(".pyi") for n in names):
                  problems.append(f"{wheel.name} lacks the compiled engine")
              for notice in ("LICENSE", "THIRD_PARTY_NOTICES"):
                  if not any(n.endswith(f".dist-info/licenses/{notice}") for n in names):
                      problems.append(f"{wheel.name} lacks {notice}")
          binaries = sorted(p.name for p in pathlib.Path("cli").iterdir())
          for target in platforms:
              archive = "zip" if "windows" in target else "tar.gz"
              if f"medh5-{raw}-{target}.{archive}" not in binaries:
                  problems.append(f"no binary for {target}")
          # Each archive carries the licences of what the binary links.
          import tarfile
          for archive in sorted(pathlib.Path("cli").iterdir()):
              if archive.name.endswith(".zip"):
                  names = zipfile.ZipFile(archive).namelist()
              else:
                  names = tarfile.open(archive).getnames()
              for notice in ("LICENSE", "THIRD_PARTY_NOTICES"):
                  if not any(n.endswith(f"/{notice}") for n in names):
                      problems.append(f"{archive.name} lacks {notice}")
          if problems:
              sys.exit("\n".join(problems))
          print(*(p.name for p in [*wheels, *sdists]), *binaries, sep="\n")
          PY

      - name: Checksum the binaries, and write the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd cli && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          mkdir homebrew
          python .github/scripts/homebrew_formula.py "$VERSION" cli/SHA256SUMS "$GITHUB_REPOSITORY" > homebrew/medh5.rb
          cat homebrew/medh5.rb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: cli/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew
          path: homebrew/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  attest:
    name: Attest every artifact's build
    # A signed statement, per file, that this workflow built it from this
    # commit: the binaries and their archives on the release page, the wheels
    # and the sdist (which PyPI's own attestations cover too).  `gh
    # attestation verify` checks one against the repository.  The only job
    # that may write attestations; the release waits for them.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: cli/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            cli/*.tar.gz
            cli/*.zip
            dist/*.whl
            dist/*.tar.gz

  # Every publishing step below can run again: a re-run after a partial
  # release skips what is already published *and identical* to this run's
  # build, publishes what is missing, and fails on anything published from
  # something else (.github/scripts/release.py; CONTRIBUTING.md has the
  # runbook).  In this repository a missing token fails its job; a fork that
  # has none only warns.

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/medh5
    permissions:
      contents: read    # the checkout, for the check after the upload
      id-token: write   # OIDC exchange for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A file PyPI already has is skipped, by name; the next step checks
          # that it is this run's file.
          skip-existing: true

      - name: PyPI has every file, as this run built it
        run: python3 .github/scripts/release.py pypi dist/

  crates:
    name: Publish to crates.io
    # In three stages.  Every crate is verified first --- built from its
    # package, as CI's `rust` job builds them --- with no token anywhere, and
    # any version crates.io already has is held to this commit's: a failure
    # publishes nothing.  Then trusted publishing exchanges this job's OIDC
    # identity for a short-lived token; then medh5-sys, medh5 and medh5-cli
    # are published, each not already there, each in the index before the
    # next, which resolves against it.  medh5-python is `publish = false`.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: crates-io
      url: https://crates.io/crates/medh5
    permissions:
      contents: read
      id-token: write   # OIDC exchange for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust CI built and tested this commit with (rust-toolchain.toml).
      - run: rustup toolchain install --no-self-update
      - name: Verify every crate, and what crates.io already has
        run: python3 .github/scripts/release.py crates verify
      # Only this repository's crates have trusted publishers; a fork's
      # exchange would fail, so a fork's release stops after verifying.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: github.repository == 'medh5-project/medh5'
      - name: cargo publish, each crate not already there
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CANONICAL: ${{ github.repository == 'medh5-project/medh5' }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            if [[ "$CANONICAL" == true ]]; then
              echo "::error::crates.io issued no token, so the crates cannot be published: each needs a trusted publisher for this workflow (CONTRIBUTING.md)"
              exit 1
            fi
            echo "::warning::a fork has no trusted publisher, so the crates were not published"
            exit 0
          fi
          python3 .github/scripts/release.py crates publish

  github-release:
    name: Create the GitHub Release
    # After the registries rather than beside them, so a release is never
    # announced for a version that `pip install` or `cargo install` cannot find.
    needs: [build, attest, publish, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the release and attach its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: cli/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create the release, or attach what a failed run did not
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          flags=()
          # A pre- or dev-release must not become the repository's "Latest",
          # and neither must a backport.
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          elif [[ "$LATEST" != true ]]; then
            flags+=(--not-latest)
          fi
          python3 .github/scripts/release.py github-release "$TAG" dist/* cli/* \
            --notes release-notes.md "${flags[@]}"

  homebrew:
    name: Update the Homebrew tap
    # The formula points at the release's binaries, so it follows the release.
    # The tap is `<owner>/homebrew-medh5` unless the HOMEBREW_TAP variable names
    # another; HOMEBREW_TAP_TOKEN needs write access to it.  The tap follows
    # the newest final release only: a pre-release, or a backport, would take
    # it back to an older version.
    needs: [build, github-release]
    if: needs.build.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew
          path: homebrew/

      - name: Push the formula, unless the tap has it already
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-medh5', github.repository_owner) }}
          VERSION: ${{ needs.build.outputs.version }}
          CANONICAL: ${{ github.repository == 'medh5-project/medh5' }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            if [[ "$CANONICAL" == true ]]; then
              echo "::error::HOMEBREW_TAP_TOKEN is not set, so $TAP cannot be updated"
              exit 1
            fi
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so $TAP was not updated"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp homebrew/medh5.rb tap/Formula/medh5.rb
          cd tap
          git add Formula/medh5.rb
          # A re-run after the push succeeded finds nothing to commit.
          if git diff --cached --quiet; then
            echo "$TAP already has the formula for medh5 $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "medh5 $VERSION"
          git push

  verify:
    name: Every channel has the release
    # Whatever became of the jobs before it: a release that stopped partway is
    # reported as one, naming what is missing where.  A fork's release, which
    # may lack the tokens, is not checked.
    needs: [build, publish, crates, github-release, homebrew]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.repository == 'medh5-project/medh5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: cli/

      - name: PyPI, crates.io, the release page and the tap have this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ needs.build.outputs.latest }}
          TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-medh5', github.repository_owner) }}
        run: |
          flags=()
          # The tap takes the newest final release only.
          if [[ "$LATEST" == true ]]; then
            flags+=(--tap "$TAP")
          fi
          python3 .github/scripts/release.py verify "$TAG" dist/ cli/ "${flags[@]}"
