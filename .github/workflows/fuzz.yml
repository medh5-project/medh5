name: Fuzz

# The engine's readers, fuzzed: `open_validate` (any file through the
# strictest validation), `clinical_columns` (a documents table's offsets and
# bytes, read deferred and scanned), the Zstandard and Blosc2 filters
# decoding chunks they did not write, `nifti_header` (NIfTI headers and
# files, gzip among them, read as the converter reads them), and
# `itk_transform` (any file read as an ITK HDF5 transform file).  A report or a
# refusal is fine; a crash, a sanitizer's report, a timeout or running out of
# memory fails the run.  The input that did it is not uploaded: a public
# repository's artifacts are public, and a crashing input works as an exploit
# until its fix ships, so reproduce a failure by running its target locally.
# A finding becomes a minimised regression test in the crate it hit, never a
# committed input.
on:
  schedule:
    - cron: "23 3 * * 2,5"
  workflow_dispatch:
  # A change to the targets, to the readers they fuzz most (the converters and
  # the annotations), to the HDF5 they read with, or to this workflow, is
  # smoke-run on its pull request.
  pull_request:
    paths:
      - fuzz/**
      - crates/medh5/src/convert/**
      - crates/medh5/src/annotations/**
      - vendor/hdf5-metno-src/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libFuzzer's instrumentation needs a nightly: a dated one, from just after
  # the stable release rust-toolchain.toml pins, moved with that pin.
  FUZZ_TOOLCHAIN: nightly-2026-10-02
  # No filter plugin is ever loaded from the runner's directories, whatever a
  # fuzzed file names (the engine turns HDF5's plugins off as well).
  HDF5_PLUGIN_PRELOAD: "::"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The C libraries --- HDF5, C-Blosc2 and the codecs --- are instrumented
    # as the Rust is: AddressSanitizer, and libFuzzer's coverage (the targets
    # link libFuzzer itself).  HDF5 keeps freed blocks on free lists of its
    # own, where the sanitizer cannot see them used after they are freed:
    # H5_USING_MEMCHECKER turns the lists off.  It is defined here because
    # hdf5-metno-src does not forward HDF5_ENABLE_USING_MEMCHECKER to HDF5's
    # CMake.  CFLAGS only: libFuzzer is C++, and is not instrumented.
    env:
      CFLAGS: -fsanitize=address,fuzzer-no-link -DH5_USING_MEMCHECKER=1
      # With its free lists off, the blocks HDF5 leaves behind when a call
      # fails are leaks the sanitizer reports as the process exits.
      ASAN_OPTIONS: detect_leaks=0
    strategy:
      fail-fast: false
      matrix:
        target: [open_validate, clinical_columns, zstd_filter, blosc2_filter, nifti_header, itk_transform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust rust-toolchain.toml pins builds cargo-fuzz; the nightly, the
      # targets.
      - run: rustup toolchain install --no-self-update
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # The C is compiled by the clang of the nightly's own LLVM, from
      # apt.llvm.org (its key checked against the fingerprint the site
      # publishes), so the C and the Rust share one sanitizer runtime.
      - name: Install the nightly's clang
        env:
          LLVM_KEY: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        run: |
          llvm=$(rustc +"$FUZZ_TOOLCHAIN" -vV | sed -n 's/^LLVM version: \([0-9]*\)\..*/\1/p')
          release=$(lsb_release -cs)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
          # The file must hold that key and no other: apt would trust every
          # primary key in it.  A primary's fingerprint is the first after
          # its `pub` line; the rest are its subkeys'.
          primaries=$(gpg --show-keys --with-colons llvm.asc \
            | awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print $10; p = 0 }')
          test "$primaries" = "$LLVM_KEY"
          sudo install -D -m 644 llvm.asc /etc/apt/keyrings/llvm.asc
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/$release/ llvm-toolchain-$release-$llvm main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-$llvm" "libclang-rt-$llvm-dev"
          rm llvm.asc
          echo "CC=clang-$llvm" >> "$GITHUB_ENV"
      # Each run saves the corpus it grew under its own key, and the next
      # restores the newest of its target's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Built as the targets are, so the run below reuses its build (HDF5's
      # among it) rather than compiling everything a second time.
      - name: Seed the corpus
        if: matrix.target == 'open_validate' || matrix.target == 'itk_transform'
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fuzz build seed
          target/x86_64-unknown-linux-gnu/release/seed "$TARGET" "corpus/$TARGET"
      # A pull request's run is a smoke test; the schedule runs 40 minutes.
      # Leaks are not checked: HDF5 leaves blocks behind when a call fails,
      # which LeakSanitizer reports on nearly every malformed file.
      - name: Fuzz
        working-directory: fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && 300 || 2400 }}
          TARGET: ${{ matrix.target }}
        run: >
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" --
          -max_total_time="$SECONDS_TO_RUN" -max_len=262144 -timeout=30
          -rss_limit_mb=4096 -malloc_limit_mb=2048 -detect_leaks=0
      # Once a week, on Tuesday's run, the corpus is minimised to what adds
      # coverage, before the cache saves it.
      - name: Minimise the corpus
        if: github.event_name == 'schedule'
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$(date -u +%u)" = 2 ]; then
            cargo +"$FUZZ_TOOLCHAIN" fuzz cmin "$TARGET"
          fi
