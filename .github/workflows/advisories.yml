name: Advisories

# What every wheel and binary compiles in (the crates Cargo.lock names), what
# the package requires and what the extras install today, checked against the
# published advisories: RustSec for the crates, PyPI's (OSV's) for the Python
# packages.  Neither sees the C libraries the crates build from source;
# SECURITY.md keeps their inventory and a reasoned disposition for each
# advisory against them, and is where a finding below is dispositioned when it
# does not apply.
on:
  # An advisory is published whether or not anything here changed.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  # `release.yml` runs this on the tagged commit before it publishes anything,
  # with `release: true`.
  workflow_call:
    inputs:
      release:
        description: a release waits for this run
        type: boolean
        default: false
  # A change to what is locked or declared is checked on its pull request.
  pull_request:
    branches: [main, "release/**"]
    paths:
      - Cargo.lock
      - pyproject.toml
      - .github/workflows/advisories.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustsec:
    name: RustSec (Cargo.lock)${{ matrix.ref && format(' on {0}', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A scheduled run starts on the default branch only, so on the schedule
    # each job audits every line: `main` and the patch line.  Any other run
    # audits the commit it was started for (an empty ref is checkout's
    # default).  A line not cut yet ends its job successfully at the first
    # step, never by a job-level `if:`, since a skipped check counts as passing.
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "release/2.2"]') || fromJSON('[""]') }}
    steps:
      - name: Whether the line exists
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ matrix.ref }}
        # Only "not found" means the line is not cut; any other failure of the
        # lookup fails the job rather than skip the audit.
        run: |
          if [ -z "$REF" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$out" | grep -q 'HTTP 404'; then
            echo "::notice::$REF does not exist yet; nothing to audit"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.line.outputs.exists == 'true'
        with:
          ref: ${{ matrix.ref }}
      - run: rustup toolchain install --no-self-update
        if: steps.line.outputs.exists == 'true'
      # A pinned release, built from its own lock.
      - run: cargo install cargo-audit --version 0.22.2 --locked
        if: steps.line.outputs.exists == 'true'
      # `--deny warnings`: an unmaintained, unsound or yanked crate fails as a
      # vulnerable one does, since each is compiled into what the project
      # ships.  One that does not apply is passed over with `--ignore ID` here,
      # with the reason in SECURITY.md.
      - run: cargo audit --deny warnings
        if: steps.line.outputs.exists == 'true'

  pypi:
    name: PyPI (the package)${{ matrix.ref && format(' on {0}', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every line on the schedule, as `rustsec` above.
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "release/2.2"]') || fromJSON('[""]') }}
    steps:
      - name: Whether the line exists
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ matrix.ref }}
        # Only "not found" means the line is not cut; any other failure of the
        # lookup fails the job rather than skip the audit.
        run: |
          if [ -z "$REF" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$out" | grep -q 'HTTP 404'; then
            echo "::notice::$REF does not exist yet; nothing to audit"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.line.outputs.exists == 'true'
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.line.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - run: pip install "pip-audit==2.10.1"
        if: steps.line.outputs.exists == 'true'
      # What `pip install medh5` installs, as it resolves today (pip-audit
      # resolves the requirements without installing them).  An advisory here
      # is one against what every user runs, and holds a release.
      - name: What the package requires
        if: steps.line.outputs.exists == 'true'
        run: |
          python - <<'PY' > requirements.txt
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print(*sorted(project["dependencies"]), sep="\n")
          PY
          cat requirements.txt
      # One that does not apply is passed over with `--ignore-vuln ID` here,
      # with the reason in SECURITY.md.
      - run: pip-audit --requirement requirements.txt --strict --desc
        if: steps.line.outputs.exists == 'true'

  pypi-extras:
    name: PyPI (the extras)${{ matrix.ref && format(' on {0}', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An extra installs a project medh5 does not ship or pin (PyTorch, MONAI,
    # pydicom, ...), whose advisory may have no fix for weeks; it is reported
    # here and dispositioned in SECURITY.md, but it does not hold a medh5
    # release.  Every other run fails on it, as `pypi` does.
    continue-on-error: ${{ inputs.release == true }}
    # Every line on the schedule, as `rustsec` above.
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "release/2.2"]') || fromJSON('[""]') }}
    steps:
      - name: Whether the line exists
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ matrix.ref }}
        # Only "not found" means the line is not cut; any other failure of the
        # lookup fails the job rather than skip the audit.
        run: |
          if [ -z "$REF" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$out" | grep -q 'HTTP 404'; then
            echo "::notice::$REF does not exist yet; nothing to audit"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.line.outputs.exists == 'true'
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.line.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - run: pip install "pip-audit==2.10.1"
        if: steps.line.outputs.exists == 'true'
      # Every extra but `dev`, with the runtime dependency they install
      # beside, as a fresh `pip install "medh5[...]"` resolves them today.
      - name: What the extras require
        if: steps.line.outputs.exists == 'true'
        run: |
          python - <<'PY' > requirements.txt
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          extras = project["optional-dependencies"]
          wanted = {*project["dependencies"]}
          for name, requirements in extras.items():
              if name != "dev":
                  wanted.update(requirements)
          print(*sorted(wanted), sep="\n")
          PY
          cat requirements.txt
      # One that does not apply is passed over with `--ignore-vuln ID` here,
      # with the reason in SECURITY.md.  The findings go to the run's summary
      # too, where a release that went ahead still shows them.
      - name: pip-audit
        if: steps.line.outputs.exists == 'true'
        run: |
          status=0
          pip-audit --requirement requirements.txt --strict --desc \
            --format markdown --output audit.md || status=$?
          {
            echo "### Advisories against the extras${REF:+ on $REF}"
            cat audit.md 2>/dev/null || echo "pip-audit wrote no report (exit $status)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.md 2>/dev/null || true
          exit "$status"
        env:
          REF: ${{ matrix.ref }}
